version: '3.8'

services:
  chatbot:
    build: .
    ports:
      - "5000:5000"
    environment:
      - LLM_BACKEND=openai_compatible
      - LLM_API_URL=http://ollama:11434
      - LLM_MODEL=smollm2:360m
      # - LLM_API_KEY=           # Uncomment for VCF Private AI
      - LLM_TIMEOUT=120        # Optional override (uses model config if not set)
      - BOOKSTORE_API_URL=http://host.docker.internal:8080
    depends_on:
      - ollama

  ollama:
    image: ghcr.io/tmm-demo-apps/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Optimized for CPU inference with smollm2:360m
      - OLLAMA_NUM_PARALLEL=1          # Single request focus (faster)
      - OLLAMA_MAX_LOADED_MODELS=1     # Keep model in memory
      - OLLAMA_KEEP_ALIVE=24h          # Prevent model unloading
    deploy:
      resources:
        limits:
          cpus: '2'                    # Match K8s limit (2 cores)
          memory: 3G                   # Match K8s limit (3Gi)
        reservations:
          cpus: '1'                    # Match K8s request (1 core)
          memory: 2G                   # Match K8s request (2Gi)
    # Pull model after container starts
    # Run: docker exec -it chatbot-app-ollama-1 ollama pull smollm2:360m

volumes:
  ollama_data:
