version: '3.8'

services:
  chatbot:
    build: .
    ports:
      - "5000:5000"
    environment:
      - LLM_BACKEND=ollama
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - BOOKSTORE_API_URL=http://host.docker.internal:8080
      - LLM_TIMEOUT=120
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull model after container starts
    # Run: docker exec -it chatbot-app-ollama-1 ollama pull llama3.2:3b

volumes:
  ollama_data:
