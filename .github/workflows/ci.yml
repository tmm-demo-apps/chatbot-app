name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install ruff
          pip install -r requirements.txt
      
      - name: Lint with ruff
        run: ruff check app/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      
      - name: Run tests
        run: pytest tests/ -v

  build:
    name: Build and Push
    runs-on: [self-hosted, linux, harbor]
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean up Docker
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          docker system prune -f --filter "until=24h" || true
          echo "Disk usage after cleanup:"
          df -h /
      
      - name: Build Docker image
        run: |
          docker build -t chatbot-app:${{ github.sha }} .
          docker tag chatbot-app:${{ github.sha }} chatbot-app:latest
          echo "✅ Docker image built: chatbot-app:${{ github.sha }}"
      
      # Generate consistent image tag for ArgoCD and Harbor
      - name: Generate image tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: image_tag
        run: |
          TAG="v$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${TAG}"
      
      # Push to Harbor (on main branch only)
      - name: Login to Harbor
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ secrets.HARBOR_URL }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin
      
      - name: Push to Harbor
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag chatbot-app:${{ github.sha }} ${{ secrets.HARBOR_URL }}/bookstore/chatbot:${{ steps.image_tag.outputs.tag }}
          docker tag chatbot-app:${{ github.sha }} ${{ secrets.HARBOR_URL }}/bookstore/chatbot:latest
          
          echo "Pushing ${{ secrets.HARBOR_URL }}/bookstore/chatbot:${{ steps.image_tag.outputs.tag }}..."
          docker push ${{ secrets.HARBOR_URL }}/bookstore/chatbot:${{ steps.image_tag.outputs.tag }}
          
          echo "Pushing ${{ secrets.HARBOR_URL }}/bookstore/chatbot:latest..."
          docker push ${{ secrets.HARBOR_URL }}/bookstore/chatbot:latest
          
          echo "✅ Pushed to Harbor: ${{ steps.image_tag.outputs.tag }}"
      
      # Update kustomization.yaml for ArgoCD GitOps (only on main branch)
      - name: Update image tag for ArgoCD
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd kubernetes/base
          sed -i 's/newTag: .*/newTag: ${{ steps.image_tag.outputs.tag }}/' kustomization.yaml
          echo "Updated kustomization.yaml:"
          cat kustomization.yaml
      
      - name: Commit and push kustomization update
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet kubernetes/base/kustomization.yaml; then
            echo "No changes to kustomization.yaml"
            exit 0
          fi
          
          git add kubernetes/base/kustomization.yaml
          git commit -m "chore: update chatbot image to ${{ steps.image_tag.outputs.tag }} [skip ci]"
          
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main
          
          echo "✅ Pushed kustomization.yaml update"
      
      - name: Deployment Summary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "## 🚀 Build & Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image pushed to Harbor:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.HARBOR_URL }}/bookstore/chatbot:${{ steps.image_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GitOps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Updated \`kubernetes/base/kustomization.yaml\` with tag \`${{ steps.image_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
