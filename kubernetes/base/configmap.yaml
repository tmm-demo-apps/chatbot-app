apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
data:
  # LLM Configuration - OpenAI-compatible backend
  # Works with Ollama (local) or VCF Private AI (enterprise)
  LLM_BACKEND: "openai_compatible"
  LLM_API_URL: "http://ollama:11434"
  LLM_MODEL: "smollm2:360m"
  # LLM_TIMEOUT: "30"  # Optional - uses model_configs.py default if not set
  
  # Bookstore API
  BOOKSTORE_API_URL: "http://app-service.bookstore:80"
  
  # === Phase 2: VCF Private AI ===
  # Uncomment and update these for VCF Private AI deployment:
  # LLM_API_URL: "https://vcf-private-ai.corp.vmbeans.com"
  # LLM_MODEL: "mistral-7b"
  # LLM_API_KEY is set via Secret, not ConfigMap
